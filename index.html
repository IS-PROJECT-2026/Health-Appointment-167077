<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book appointments with qualified doctors online">
    <title>Health Appointment Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="#" class="nav__logo">
                <span class="logo-icon">🏥</span>
                <span class="logo-text">HealthCare</span>
            </a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="#home" class="nav__link active-link">Home</a>
                    </li>
                    <li class="nav__item">
                        <a href="#doctors" class="nav__link">Doctors</a>
                    </li>
                    <li class="nav__item">
                        <a href="#appointments" class="nav__link">Appointments</a>
                    </li>
                    <li class="nav__item">
                        <a href="#contact" class="nav__link">Contact</a>
                    </li>
                </ul>

                <!-- Close button for mobile -->
                <div class="nav__close" id="nav-close">
                    <span>&times;</span>
                </div>
            </div>

            <!-- Toggle button for mobile -->
            <div class="nav__toggle" id="nav-toggle">
                <span>&#9776;</span>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="section" id="home">
            <h1>Welcome to HealthCare Appointment System</h1>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 HealthCare System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
